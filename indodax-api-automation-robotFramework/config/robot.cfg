[options]
# ─── Output Paths ─────────────────────────────────────────────────────────────
outputdir  = results
log        = log.html
report     = report.html
output     = output.xml

# ─── Execution ────────────────────────────────────────────────────────────────
# Run all tests by default; override via CLI: --suite or --include tag
suite      = tests

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel   = INFO
# Set to DEBUG for detailed HTTP traffic:
# loglevel = DEBUG

# ─── Tagging Metadata ─────────────────────────────────────────────────────────
# Common tag filters:
#   --include smoke          → CI gate only
#   --include happy-path     → all happy-path tests
#   --include negative       → all negative tests
#   --include performance    → all SLA tests
#   --exclude performance    → skip SLA (useful in slow CI environments)

# ─── Listeners / Plugins ─────────────────────────────────────────────────────
# Uncomment to enable Pabot (parallel):
# listener = pabot.PabotLib

# ─── Variable Overrides ───────────────────────────────────────────────────────
# Override base URL for staging environment:
# variable = BASE_URL:https://staging.indodax.com
